name: JanSetu AI Tests

on:
  push:
    branches: [main]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          cd frontend
          npm install
          npx playwright install --with-deps
      - name: Run Playwright Tests
        run: |
          cd frontend
          npx playwright test
